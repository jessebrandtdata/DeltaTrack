(b)Section 409 of the Federal Food, Drug, and Cosmetic Act (21 U.S.C. 348) is amended—(1)in subsection(b)—(A)by redesignating paragraphs(3) through(5) as paragraphs(4) through(6), respectively; and(B)by inserting after paragraph(2) the following:(3)In the case of a zootechnical animal food substance, such petition shall, in addition to any explanatory or supporting data, contain—(A)all relevant data bearing on the effect the zootechnical animal food substance is intended to have and the quantity of such substance required to produce the intended effect; and(B)full reports of investigations made with respect to the intended use of such substance, including full information as to the methods and controls used in conducting such investigations.;(2)in subsection(c)—(A)by amending subparagraph(A) of paragraph(1) to read as follows:(A)(i)by order establish a regulation (whether or not in accord with that proposed by the petitioner) prescribing—(I)with respect to one or more proposed uses of the food additive involved, the conditions under which such additive may be safely used (including specifications as to the particular food or classes of food in or on which such additive may be used, the maximum quantity which may be used or permitted to remain in or on such food, the manner in which such additive may be added to or used in or on such food, and any directions or other labeling or packaging requirements for such additive as the Secretary determines necessary to assure the safety of such use); and(II)in the case of a zootechnical animal food substance, the conditions under which such substance may be used to achieve the intended effect; and(ii)notify the petitioner of such order and the reasons for such action; or; and(B)in paragraph(3)—(i)in subparagraph(A), by striking ; or and inserting a semicolon;(ii)in subparagraph(B), by striking the period and inserting ; or; and(iii)by adding at the end the following:(C)in the case of a zootechnical animal food substance, fails to establish that the proposed use of the substance, under the conditions of use to be specified in the regulation, will achieve the intended effect.; and(3)by adding at the end the following:(l)Zootechnical animal food substances The labeling of a zootechnical animal food substance—(1)shall include the statement: Not for use in the diagnosis, cure, mitigation, treatment, or prevention of disease in animals.; and(2)may include statements regarding the intended effect of the substance on the structure or function of the body of animals, as set forth in section 201(tt)(1)..'''

