text = '''
The United States International Development Finance Corporation (the Corporation) is authorized to make such expenditures and commitments within the limits of funds and borrowing authority available to the Corporation, and in accordance with the law, and to make such expenditures and commitments without regard to fiscal year limitations, as provided by section 9104 of title 31, United States Code, as may be necessary in carrying out the programs for the current fiscal year for the Corporation: Provided, That for necessary expenses of the activities described in subsections(b),(c),(e),(f), and(g) of section 1421 of the BUILD Act of 2018 (division F of Public Law 115–254) and for administrative expenses to carry out authorized activities described in section 1434(d) of such Act, $1,008,400,000: Provided further, That of the amount provided— (1)$245,000,000 shall remain available until September 30, 2027, for administrative expenses to carry out authorized activities (including an amount for official reception and representation expenses which shall not exceed $25,000); and (2)$763,400,000 shall remain available until September 30, 2027, for the activities described in subsections(b),(c),(e),(f), and(g) of section 1421 of the BUILD Act of 2018, except such amounts obligated in a fiscal year for activities described in section 1421(c) of such Act shall remain available for disbursement for the term of the underlying project: Provided further, That amounts made available under this paragraph may be paid to the United States International Development Finance Corporation—Program Account for programs authorized by subsections(b),(e),(f), and(g) of section 1421 of the BUILD Act of 2018: Provided further, That funds may only be obligated pursuant to section 1421(g) of the BUILD Act of 2018 subject to prior consultation with the appropriate congressional committees and the regular notification procedures of the Committees on Appropriations: Provided further, That funds appropriated by this Act and prior Acts making appropriations for the Department of State, foreign operations, and related programs for support by the Corporation in upper-middle income countries shall be subject to prior consultation with the Committees on Appropriations: Provided further, That in fiscal year 2025 collections of amounts described in section 1434(h) of the BUILD Act of 2018 shall be credited as offsetting collections to this appropriation: Provided further, That such collections collected in fiscal year 2025 in excess of $1,008,400,000 shall be credited to this account and shall be available in future fiscal years only to the extent provided in advance in appropriations Acts: Provided further, That in fiscal year 2025, if such collections are less than $1,008,400,000, receipts collected pursuant to the BUILD Act of 2018 and the Federal Credit Reform Act of 1990, in an amount equal to such shortfall, shall be credited as offsetting collections to this appropriation: Provided further, That fees charged for project-specific transaction costs as described in section 1434(k) of the BUILD Act of 2018, and other direct costs associated with origination or monitoring services provided to specific or potential investors, shall not be considered administrative expenses for the purposes of this heading: Provided further, That such fees shall be credited to this account for such purposes, to remain available until expended: Provided further, That funds appropriated or otherwise made available under this heading may not be used to provide any type of assistance that is otherwise prohibited by any other provision of law or to provide assistance to any foreign country that is otherwise prohibited by any other provision of law: Provided further, That the sums herein appropriated from the General Fund shall be reduced on a dollar-for-dollar basis by the offsetting collections described under this heading so as to result in a final fiscal year appropriation from the General Fund estimated at $593,400,000.'''

