(b)Flags None of the funds appropriated or otherwise made available by this Act may be obligated or expended to fly or display a flag over a facility of the United States Department of State other than the—(1)United States flag;(2)Foreign Service flag pursuant to 2 FAM 154.2–1;(3)POW/MIA flag;(4)Hostage and Wrongful Detainee flag, pursuant to section 904 of title 36, United States Code;(5)flag of a State, insular area, or the District of Columbia at domestic locations;(6)flag of an Indian Tribal government;(7)official branded flag of a United States agency; or(8)sovereign flag of other countries.'''

