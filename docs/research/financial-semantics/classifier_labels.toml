(a)Notwithstanding any other provision of law, $63,000,000 from the funds described in subsection(c), in addition to amounts made available in paragraph(9) under the heading Highway Infrastructure Programs, shall be available for a competitive highway bridge program for States that—(1)have—(A)a population density of less than 115 individuals per square mile; or(B)a population of less than 1,100,000 individuals; and(2)have—(A)less than 26 percent of total bridges classified as in good condition; or(B)greater than or equal to 5.2 percent of total bridges classified as in poor condition: Provided, That any such State with more than 14 percent of total bridges classified as in poor condition shall receive not less than $32,500,000 of the funds made available under this subsection or in paragraph(9) under the heading Highway Infrastructure Programs for grant applications for projects eligible under this subsection: Provided further, That if the Secretary determines that eligible applications from any such State meeting the criteria under the preceding proviso are insufficient to make awards of at least $32,500,000, the Secretary shall use the unutilized amounts to provide other grants to States eligible under this subsection: Provided further, That no State shall be awarded more than $55,000,000 in awards from funds made available under this subsection or in paragraph(9) under the heading Highway Infrastructure Programs: Provided further, That the funds made available under this subsection shall be used for highway bridge replacement or rehabilitation projects on public roads that demonstrate cost savings by bundling multiple highway bridge projects and, except as otherwise provided in this section, shall be administered as if apportioned under chapter 1 of title 23, United States Code: Provided further, That the requirements of section 144(j)(5) of title 23, United States Code, shall not apply to funds made available under this subsection: Provided further, That for purposes of this subsection, the Secretary shall calculate population and population density figures based on the latest available data from the decennial census conducted under section 141(a) of title 13, United States Code: Provided further, That for purposes of this subsection, the Secretary shall calculate the percentages of bridge counts (including the percentages of bridge counts classified as in poor and good condition) based on the national bridge inventory as of June 2023: Provided further, That section 11101(e) of the Infrastructure Investment and Jobs Act (Public Law 117–58) shall apply to funds made available under this subsection.'''

