(e)Prohibition Notwithstanding any other provision of this Act, funds appropriated or otherwise made available by this Act or other Acts making appropriations for the Department of State, foreign operations, and related programs, including provisions of Acts providing supplemental appropriations for the Department of State, foreign operations, and related programs, may not be used for a contribution, grant, or other payment to the United Nations Relief and Works Agency (UNRWA), notwithstanding any other provision of law, for any amounts provided in fiscal year 2024 or prior fiscal years, or for amounts provided in fiscal year 2025 until March 25, 2025: Provided, That funds for UNRWA may be made available following such date if the President certifies and reports to the appropriate congressional committees that UNRWA has—(1)received and is implementing the recommendations of, as appropriate, a review by an independent entity of UNRWA’s implementation of its policies and procedures pertaining to neutrality, ethics, and oversight of staff;(2)completed enhanced vetting of all active UNRWA personnel in Gaza, in consultation, as appropriate, with the United Nations and the Government of Israel;(3)acted promptly to investigate any derogatory information identified during such vetting and is taking action to remedy any violation of its policies; and(4)shared with its Advisory Commission initial results of steps taken to demonstrate UNRWA’s resolve to implement reforms: Provided further, That such conditions must be recertified by the President every 90 days until September 30, 2025: Provided further, That not later than 30 days after the date of enactment of this Act, and concurrent with each certification submitted pursuant to the previous proviso thereafter until September 30, 2025, the Secretary of State shall brief the appropriate congressional committees on the implementation of this section: Provided further, That funds made available by this Act shall be made available, as appropriate, to help build the capacity of other implementers of United States humanitarian assistance in Gaza.'''

