Funds appropriated to the Forest Service under the headings National Forest System and Forest and Rangeland Research may be used for expenses associated with primary and secondary schooling for dependents of agency personnel stationed in Puerto Rico, who are subject to transfer and reassignment to other locations in the United States, at a cost not in excess of those authorized for the Department of Defense for the same area, when it is determined by the Chief of the Forest Service that public schools available in the locality are unable to provide adequately for the education of such dependents; Provided, That Congress hereby ratifies and approves payments for such purposes to agency employees stationed in Puerto Rico made by the Forest Service after August 2, 2005, in accordance with the 19th unnumbered paragraph under the heading Administrative Provisions, Forest Service in title III of Public Law 109–54, as amended. Funds appropriated to the Forest Service shall be available for interactions with and providing technical assistance to rural communities and natural resource-based businesses for sustainable rural development purposes. Funds appropriated to the Forest Service shall be available for payments to counties within the Columbia River Gorge National Scenic Area, pursuant to section 14(c)(1) and(2), and section 16(a)(2) of Public Law 99–663. Any funds appropriated to the Forest Service may be used to meet the non-Federal share requirement in section 502(c) of the Older Americans Act of 1965 (42 U.S.C. 3056(c)(2)). The Forest Service shall not assess funds for the purpose of performing fire, administrative, and other facilities maintenance and decommissioning. Notwithstanding any other provision of law, of any appropriations or funds available to the Forest Service, not to exceed $500,000 may be used to reimburse the Office of the General Counsel (OGC), Department of Agriculture, for travel and related expenses incurred as a result of OGC assistance or participation requested by the Forest Service at meetings, training sessions, management reviews, land purchase negotiations, and similar matters unrelated to civil litigation: Provided, That future budget justifications for both the Forest Service and the Department of Agriculture should clearly display the sums previously transferred and the sums requested for transfer. An eligible individual who is employed in any project funded under title V of the Older Americans Act of 1965 (42 U.S.C. 3056 et seq.) and administered by the Forest Service shall be considered to be a Federal employee for purposes of chapter 171 of title 28, United States Code.'''

