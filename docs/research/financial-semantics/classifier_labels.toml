(a)Egypt(1)Assistance Of the funds appropriated by this Act, not less than $1,425,000,000 should be made available for assistance for Egypt, of which—(A)not less than $125,000,000 shall be made available from funds under the heading Economic Support Fund, of which not less than $40,000,000 should be made available for higher education programs, including not less than $15,000,000 for scholarships for Egyptian students with high financial need to attend not-for-profit institutions of higher education in Egypt that are currently accredited by a regional accrediting agency recognized by the United States Department of Education, or meets standards equivalent to those required for United States institutional accreditation by a regional accrediting agency recognized by such Department: Provided, That such funds shall be made available for democracy programs, and for development programs in the Sinai; and(B)not less than $1,300,000,000 should be made available from funds under the heading Foreign Military Financing Program, to remain available until September 30, 2026: Provided, That except as provided for in the following proviso, such funds may be transferred to an interest bearing account in the Federal Reserve Bank of New York, following consultation with the Committees on Appropriations and the uses of any interest earned on such funds shall be subject to the regular notification procedures of the Committees on Appropriations: Provided further, That of the amounts made available in this subparagraph, an amount equal to interest earned on funds deposited in the Federal Reserve Bank of New York pursuant to the preceding proviso as of the date of enactment of this Act shall be transferred to, and merged with, funds appropriated by this Act under title III for assistance for democracy programs, economic growth, and humanitarian assistance, subject to prior consultation with, and the regular notification procedures of, the Committees on Appropriations: Provided further, That such transfer authority is in addition to any transfer authority otherwise available by this Act or any other Act.(2)Certification and report Funds appropriated by this Act that are available for assistance for Egypt may be made available notwithstanding any other provision of law restricting assistance for Egypt, except for this subsection and section 620M of the Foreign Assistance Act of 1961, and may only be made available for assistance for the Government of Egypt if the Secretary of State certifies and reports to the Committees on Appropriations that such government is—(A)sustaining the strategic relationship with the United States; and(B)meeting its obligations under the 1979 Egypt-Israel Peace Treaty.(3)Withholding Of the funds made available pursuant to paragraph(1)(B), $320,000,000 shall be withheld from obligation until the Secretary certifies and reports to the Committees on Appropriations that the Government of Egypt is meeting the requirements under this section in the report accompanying this Act: Provided, That the Secretary may waive such requirement if the Secretary determines and reports to the Committees on Appropriations that such funds are necessary for counterterrorism, border security, or nonproliferation programs or that it is otherwise important to the national security interest of the United States to do so, including a detailed justification for the use of such waiver and the reasons why any of the requirements cannot be met: Provided further, That the report required by the previous proviso shall be submitted in unclassified form but may be accompanied by a classified annex.'''

