note = ""
text = '''
Not to exceed $38,500,000 made available for the current fiscal year in this Act within Safety, Security and Mission Services may be transferred to the Working Capital Fund of the National Aeronautics and Space Administration. Balances so transferred shall be available until expended only for activities described in section 30102(b)(3) of title 51, United States Code, as amended by this Act, and shall remain available until expended. Any transfer pursuant to this provision shall be treated as a reprogramming of funds under section 505 of this Act and shall not be available for obligation except in compliance with the procedures set forth in that section. There is hereby established in the Treasury of the United States a fund to be known as the National Aeronautics and Space Administration Nonrecurring Expenses Fund (the Fund). Unobligated balances of expired discretionary funds appropriated for this or any succeeding fiscal year from the General Fund of the Treasury to the National Aeronautics and Space Administration (NASA) by this or any other Act may be transferred (not later than the end of the fifth fiscal year after the last fiscal year for which such funds are available for the purposes for which appropriated) into the Fund. Amounts deposited in the Fund shall be available until expended, and in addition to such other funds as may be available for such purposes, for facilities infrastructure improvements, including nonrecurring maintenance, necessary for the operation of NASA, subject to approval by the Office of Management and Budget. Amounts in the Fund may not be available for the purpose described in subsection(b)(3) of section 30102 of title 51, United States Code. Amounts in the Fund may be obligated only after the Committees on Appropriations of the House of Representatives and the Senate are notified at least 15 days in advance of the planned use of funds.'''

