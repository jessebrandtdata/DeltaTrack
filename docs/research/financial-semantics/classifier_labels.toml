(a)Lethal military equipment exports(1)Prohibition None of the funds appropriated or otherwise made available under titles III through VI of this Act may be made available to any foreign government which provides lethal military equipment to a country the government of which the Secretary of State has determined supports international terrorism for purposes of section 1754(c) of the Export Reform Control Act of 2018 (50 U.S.C. 4813(c)): Provided, That the prohibition under this section with respect to a foreign government shall terminate 12 months after that government ceases to provide such military equipment: Provided further, That this section applies with respect to lethal military equipment provided under a contract entered into after October 1, 1997.(2)Determination Assistance restricted by paragraph(1) or any other similar provision of law, may be furnished if the President determines that to do so is important to the national interest of the United States.(3)Report Whenever the President makes a determination pursuant to paragraph(2), the President shall submit to the Committees on Appropriations a report with respect to the furnishing of such assistance, including a detailed explanation of the assistance to be provided, the estimated dollar amount of such assistance, and an explanation of how the assistance furthers the United States national interest.'''

