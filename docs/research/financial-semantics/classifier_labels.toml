text_sha256 = "5204ec7448ec30363e798ab576ca57fd6632707d058886ff82b54832b8bc14b0"
predicted = "cap"
label = ""
note = ""
text = '''
To carry out the Riegle Community Development and Regulatory Improvement Act of 1994 (subtitle A of title I of Public Law 103–325), including services authorized by section 3109 of title 5, United States Code, but at rates for individuals not to exceed the per diem rate equivalent to the rate for EX–III, $354,000,000. Of the amount appropriated under this heading— (1)not less than $191,000,000, notwithstanding section 108(e) of Public Law 103–325 (12 U.S.C. 4707(e)) with regard to Small and/or Emerging Community Development Financial Institutions Assistance awards, is available until September 30, 2026, for financial assistance and technical assistance under subparagraphs(A) and(B) of section 108(a)(1), respectively, of Public Law 103–325 (12 U.S.C. 4707(a)(1)(A) and(B)), of which up to $1,600,000 may be available for training and outreach under section 109 of Public Law 103–325 (12 U.S.C. 4708), of which up to $3,153,750 may be used for the cost of direct loans, of which up to $10,000,000, notwithstanding subsection(d) of section 108 of Public Law 103–325 (12 U.S.C. 4707(d)), may be available to provide financial assistance, technical assistance, training, and outreach to community development financial institutions to expand investments that benefit individuals with disabilities, and of which up to $2,000,000 shall be for the Economic Mobility Corps to be operated in conjunction with the Corporation for National and Community Service, pursuant to 42 U.S.C. 12571: Provided, That the cost of direct and guaranteed loans, including the cost of modifying such loans, shall be as defined in section 502 of the Congressional Budget Act of 1974: Provided further, That these funds are available to subsidize gross obligations for the principal amount of direct loans not to exceed $25,000,000: Provided further, That of the funds provided under this paragraph, excluding those made to community development financial institutions to expand investments that benefit individuals with disabilities and those made to community development financial institutions that serve populations living in persistent poverty counties, the CDFI Fund shall prioritize Financial Assistance awards to organizations that invest and lend in high-poverty areas: Provided further, That for purposes of this section, the term high-poverty area means any census tract with a poverty rate of at least 20 percent as measured by the 2016–2020 5-year data series available from the American Community Survey of the Bureau of the Census for all States and Puerto Rico or with a poverty rate of at least 20 percent as measured by the 2020 Island areas Decennial Census data for any territory or possession of the United States; (2)not less than $35,000,000, notwithstanding section 108(e) of Public Law 103–325 (12 U.S.C. 4707(e)), is available until September 30, 2026, for financial assistance, technical assistance, training, and outreach programs designed to benefit Native American, Native Hawaiian, and Alaska Native communities and provided primarily through qualified community development lender organizations with experience and expertise in community development banking and lending in Indian country, Native American organizations, Tribes and Tribal organizations, and other suitable providers; (3)not less than $40,000,000 is available until September 30, 2026, for the Bank Enterprise Award program; (4)not less than $24,000,000, notwithstanding subsections(d) and(e) of section 108 of Public Law 103–325 (12 U.S.C. 4707(d) and(e)), is available until September 30, 2026, for a Healthy Food Financing Initiative to provide financial assistance, technical assistance, training, and outreach to community development financial institutions for the purpose of offering affordable financing and technical assistance to expand the availability of healthy food options in distressed communities; (5)not less than $9,000,000 is available until September 30, 2026, to provide grants for loan loss reserve funds and to provide technical assistance for small dollar loan programs under section 122 of Public Law 103–325 (12 U.S.C. 4719): Provided, That sections 108(d) and 122(b)(2) of such Public Law shall not apply to the provision of such grants and technical assistance; (6)up to $45,000,000 is available for administrative expenses, including administration of CDFI Fund programs and the New Markets Tax Credit Program, of which not less than $1,000,000 is for the development of tools to better assess and inform CDFI investment performance and CDFI program impacts, and up to $300,000 is for administrative expenses to carry out the direct loan program; and (7)up to $10,000,000 is available until September 30, 2026 for the cost, as defined in section 502 of the Congressional Budget Act of 1974, of commitments to guarantee bonds and notes under section 114A of the Riegle Community Development and Regulatory Improvement Act of 1994 (12 U.S.C. 4713a): Provided, That commitments to guarantee bonds and notes under such section 114A shall not exceed $500,000,000: Provided further, That such section 114A shall remain in effect until December 31, 2026: Provided further, That of the funds awarded under this heading, except those provided for the Economic Mobility Corps, not less than 10 percent shall be used for awards that support investments that serve populations living in persistent poverty counties: Provided further, That for the purposes of this paragraph and paragraph(1), the term persistent poverty counties means any county, including county equivalent areas in Puerto Rico, that has had 20 percent or more of its population living in poverty over the past 30 years, as measured by the 1990 and 2000 decennial censuses and the 2016–2020 5-year data series available from the American Community Survey of the Bureau of the Census or any other territory or possession of the United States that has had 20 percent or more of its population living in poverty over the past 30 years, as measured by the 1990, 2000, 2010, and 2020 Island Areas Decennial Censuses, or equivalent data, of the Bureau of the Census.'''

