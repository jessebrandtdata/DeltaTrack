Notwithstanding 31 U.S.C. 1346 and section 708 of this Act, the head of each Executive department and agency is hereby authorized to transfer to or reimburse General Services Administration, Government-wide Policy with the approval of the Director of the Office of Management and Budget, funds made available for the current fiscal year by this or any other Act, including rebates from charge card and other contracts: Provided, That these funds shall be administered by the Administrator of General Services to support Government-wide and other multi-agency financial, information technology, procurement, and other management innovations, initiatives, and activities, including improving coordination and reducing duplication, as approved by the Director of the Office of Management and Budget, in consultation with the appropriate interagency and multi-agency groups designated by the Director (including the President's Management Council for overall management improvement initiatives, the Chief Financial Officers Council for financial management initiatives, the Chief Information Officers Council for information technology initiatives, the Chief Human Capital Officers Council for human capital initiatives, the Chief Acquisition Officers Council for procurement initiatives, and the Performance Improvement Council for performance improvement initiatives): Provided further, That the total funds transferred or reimbursed shall not exceed $15,000,000 to improve coordination, reduce duplication, and for other activities related to Federal Government Priority Goals established by 31 U.S.C. 1120, and not to exceed $17,000,000 for Government-wide innovations, initiatives, and activities: Provided further, That the funds transferred to or for reimbursement of General Services Administration, Government-Wide Policy during fiscal year 2025 shall remain available for obligation through September 30, 2026: Provided further, That not later than 90 days after enactment of this Act, the Director of the Office of Management and Budget, in consultation with the Administrator of General Services, shall submit to the Committees on Appropriations of the House of Representatives and the Senate, the Committee on Homeland Security and Governmental Affairs of the Senate, and the Committee on Oversight and Accountability of the House of Representatives a detailed spend plan for the funds to be transferred or reimbursed: Provided further, That the spend plan shall, at a minimum, include:(i) the amounts currently in the funds authorized under this section and the estimate of amounts to be transferred or reimbursed in fiscal year 2025;(ii) a detailed breakdown of the purposes for all funds estimated to be transferred or reimbursed pursuant to this section (including total number of personnel and costs for all staff whose salaries are provided for by this section);(iii) where applicable, a description of the funds intended for use by or for the benefit of each executive council; and(iv) where applicable, a description of the funds intended for use by or for the implementation of specific laws passed by Congress: Provided further, That no transfers or reimbursements may be made pursuant to this section until 15 days following notification of the Committees on Appropriations of the House of Representatives and the Senate by the Director of the Office of Management and Budget.'''

